<header class="appbar">
  <div class="appbar-left">
    <a href="{{ url_for('index') }}" class="brand">
      <strong>Ingenium Education Group</strong> · Contract Generator
    </a>
    <div class="sub">CCNL ANINSEI 2024–2027</div>
  </div>
  {% if user %}
  <div class="appbar-right">
    <a href="{{ url_for('contracts_list') }}" class="nav-link">I miei contratti</a>
    <a href="{{ url_for('index') }}" class="nav-link">Nuovo contratto</a>
    <div class="user-chip">
      {% if user.picture %}<img src="{{ user.picture }}" alt="">{% endif %}
      <span>{{ user.name or user.email }}</span>
      <a href="{{ url_for('auth.logout') }}" title="Esci">↪</a>
    </div>
  </div>
  {% endif %}
</header>

<style>
.appbar {
  background: #1A3A5C; color: #fff;
  padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 1px 2px rgba(0,0,0,0.06), 0 6px 18px rgba(26,58,92,0.08);
  font-family: Inter, -apple-system, "Segoe UI", Arial, sans-serif;
  flex-wrap: wrap; gap: 10px;
}
.appbar a { color: #fff; text-decoration: none; }
.appbar .brand { font-size: 15px; }
.appbar .sub { font-size: 11px; opacity: 0.75; margin-top: 1px; }
.appbar-right { display: flex; align-items: center; gap: 18px; font-size: 13px; }
.appbar .nav-link { opacity: 0.85; }
.appbar .nav-link:hover { opacity: 1; text-decoration: underline; }
.user-chip {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.10);
  padding: 4px 10px 4px 4px;
  border-radius: 99px;
  font-size: 13px;
}
.user-chip img { width: 26px; height: 26px; border-radius: 50%; }
.user-chip a {
  margin-left: 6px;
  opacity: 0.75;
  font-size: 16px;
  line-height: 1;
}
.user-chip a:hover { opacity: 1; }
</style>
