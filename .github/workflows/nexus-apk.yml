name: NEXUS APK Build

on:
  push:
    branches: ["**"]
    paths:
      - "nexus/**"
      - ".github/workflows/nexus-apk.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build NEXUS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: nexus
        run: flutter pub get

      - name: Analyse (non-blocking)
        working-directory: nexus
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK
        working-directory: nexus
        run: flutter build apk --debug

      - name: Build release APK
        working-directory: nexus
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-debug-apk
          path: nexus/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-release-apk
          path: nexus/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/claude/build-this-q234sk' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-v1.0.0-${{ github.run_number }}
          name: "NEXUS v1.0.0 (build ${{ github.run_number }})"
          body: |
            ## NEXUS — Coordinated Sciences, connected.

            First half of Cambridge IGCSE Co-ordinated Sciences 0654
            — Biology, Chemistry and Physics — as one mastery game.

            ### What's in this build (Phase 0 + 1)
            - Full 5-round daily session loop (WARM-UP → LEARN → APPLY → LAB → CRACK)
            - 3 fully playable nodes: F1 Motion, L3 Cell movement, M1 Particle theory
            - SM-2 spaced repetition, forgiving streaks, XP + rank system
            - Interactive fl_chart graphs, live keyword highlighting
            - Mark-scheme feedback with missed keywords returned instantly
            - World Model map — all 21 nodes across 3 realms

            ### Install
            Download `NEXUS-release-apk`, enable *Install from unknown sources* on your Android device, and install.

            > Offline-first · no login · no real-money anything
          files: |
            nexus/build/app/outputs/flutter-apk/app-release.apk
            nexus/build/app/outputs/flutter-apk/app-debug.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
