name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APKs (FamilyNest + CODEX)
        run: ./gradlew :app:assembleDebug :codex:assembleDebug --no-daemon --stacktrace

      - name: Upload FamilyNest debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FamilyNest-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload CODEX debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CODEX-IlCifrarioLatino-debug-apk
          path: codex/build/outputs/apk/debug/codex-debug.apk
          if-no-files-found: error
