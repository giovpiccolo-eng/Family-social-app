name: nexus
description: NEXUS — Coordinated Sciences, connected. First half of Cambridge IGCSE 0654.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local persistence
  shared_preferences: ^2.2.3

  # Animations
  flutter_animate: ^4.5.0

  # Charts / data viz
  fl_chart: ^0.68.0

  # Typography
  google_fonts: ^6.2.1

  # Utils
  collection: ^1.18.0
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/content/
